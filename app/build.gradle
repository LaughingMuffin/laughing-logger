plugins {
    id 'com.android.application'

    // Add the Google services Gradle plugin
    id 'com.google.gms.google-services'

    // Google secrets plugin
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

android {
    namespace 'org.laughing.logger'
    compileSdk = 37

    defaultConfig {
        applicationId "org.laughing.logger"
        minSdk 21
        targetSdkVersion 35
        versionName '3.0.4'
        versionCode 304

        multiDexEnabled true

        testApplicationId "org.laughing.logger.test"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [appName: "@string/app_name"]

        vectorDrawables.useSupportLibrary = true
    }

    if (project.hasProperty("RELEASE_STORE_FILE")) {
        signingConfigs {
            release {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS_LL
                keyPassword RELEASE_KEY_PASSWORD_LL
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            versionNameSuffix '-DEBUG'
            manifestPlaceholders = [appName: "Laughing Logger DEBUG"]
        }
    }

    flavorDimensions "store"
    productFlavors {
        play {
            dimension "store"
        }
        fdroid {
            dimension "store"
            applicationId "org.laughing.logger"
            manifestPlaceholders = [appName: "@string/app_name_libre"]
        }
    }

    compileOptions {
        targetCompatibility 1.8
        sourceCompatibility 1.8
    }
}

// Don't fail for variants without google-services.json — the fdroid flavor
// intentionally ships no Firebase config.
googleServices {
    missingGoogleServicesStrategy = 'IGNORE'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation 'androidx.annotation:annotation:1.10.0'
    // No longer pulled in transitively by appcompat 1.7+. Deprecated upstream;
    // a future refactor should replace it with a non-broadcast mechanism.
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // Material 1.14+ requires minSdk 23; 1.13.0 is the last version compatible with minSdk 21.
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'

    implementation 'com.afollestad.material-dialogs:commons:0.9.6.0'

    playImplementation platform('com.google.firebase:firebase-bom:32.6.0')
    playImplementation("com.google.firebase:firebase-crashlytics")
    playImplementation("com.google.firebase:firebase-analytics")

    implementation 'com.mikhaellopez:circularprogressbar:3.1.0'
}

// google-services is already applied via the plugins {} block above.
apply plugin: 'com.google.firebase.crashlytics'